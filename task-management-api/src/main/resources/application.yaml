spring:
  application:
    name: mini-project-task-management-api
  profiles:
    active: prod

  datasource:
    url: jdbc:postgresql://192.168.56.4:5432/testdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,conditions  # NEVER include env/configprops in prod
  endpoint:
    health:
      show-details: always   # or when-authorized in prod
    metrics:
      enabled: true


