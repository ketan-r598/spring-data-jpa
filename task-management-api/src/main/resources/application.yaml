spring:
  application:
    name: mini-project-task-management-api
  profiles:
    active: prod
  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    defer-datasource-initialization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,conditions  # NEVER include env/configprops in prod
  endpoint:
    health:
      show-details: always   # or when-authorized in prod
    metrics:
      enabled: true


